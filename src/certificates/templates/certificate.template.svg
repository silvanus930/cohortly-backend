<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="850" fill="#fffdf7"/>
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="#1f2937" stroke-width="3"/>
  <rect x="44" y="44" width="1112" height="762" fill="none" stroke="#c7a44a" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="18" fill="url(#band)"/>
  <text x="600" y="150" text-anchor="middle" font-size="24" letter-spacing="8" fill="#6b7280">{{APP_NAME}}</text>
  <text x="600" y="235" text-anchor="middle" font-size="58" fill="#111827">Certificate of Completion</text>
  <text x="600" y="310" text-anchor="middle" font-size="22" fill="#6b7280">This certifies that</text>
  <text x="600" y="385" text-anchor="middle" font-size="52" font-style="italic" fill="#1d4ed8">{{RECIPIENT}}</text>
  <text x="600" y="450" text-anchor="middle" font-size="22" fill="#6b7280">has successfully completed the course</text>
  <text x="600" y="515" text-anchor="middle" font-size="40" fill="#111827">{{COURSE}}</text>
  <text x="600" y="580" text-anchor="middle" font-size="20" fill="#374151">Completed on {{COMPLETED_ON}}</text>
  <line x1="240" y1="690" x2="520" y2="690" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="380" y="720" text-anchor="middle" font-size="18" fill="#374151">{{INSTRUCTOR}}</text>
  <text x="380" y="746" text-anchor="middle" font-size="14" fill="#9ca3af">Instructor</text>
  <line x1="680" y1="690" x2="960" y2="690" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="820" y="720" text-anchor="middle" font-size="18" fill="#374151">{{CODE}}</text>
  <text x="820" y="746" text-anchor="middle" font-size="14" fill="#9ca3af">Verify at {{VERIFY_URL}}</text>
</svg>
